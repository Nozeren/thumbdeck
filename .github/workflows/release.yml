# A tag like v0.2.0 (made by scripts/release.sh) builds thumbdeck for Linux and macOS, signs the
# builds with the updater key, and publishes them to the public Nozeren/thumbdeck-releases repo,
# with the latest.json installed apps check for updates, and install.sh (which installs the
# latest release: curl -fsSL .../releases/latest/download/install.sh | bash).
#
# Secrets:
#   RELEASES_TOKEN              fine-grained token: Contents read on thumbdeck and
#                               thumbdeck-toolkits (the submodule), read and write on
#                               thumbdeck-releases
#   TAURI_SIGNING_PRIVATE_KEY   ~/.tauri/thumbdeck.key (its public half is src-tauri/src/updater.pub)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: macos-latest
            platform: darwin-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.RELEASES_TOKEN }} # the toolkits submodule is private

      - name: The tag matches the app's version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tauri.conf.json says $version but the tag is $GITHUB_REF_NAME" >&2; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'darwin-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux libraries
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev

      - run: npm ci

      - name: Build (Linux)
        if: matrix.platform == 'linux-x86_64'
        run: |
          npm run tauri build -- --no-bundle
          # The binary, and the icons install.sh puts in the launcher (the updater takes the binary)
          mkdir -p out stage
          cp src-tauri/target/release/thumbdeck stage/
          cp assets/icon.svg stage/thumbdeck.svg
          cp src-tauri/icons/128x128.png stage/thumbdeck.png
          tar -czf out/thumbdeck-linux-x86_64.tar.gz -C stage thumbdeck thumbdeck.svg thumbdeck.png

      - name: Build (macOS)
        if: matrix.platform == 'darwin-universal'
        run: |
          npm run tauri build -- --target universal-apple-darwin --bundles app
          mkdir -p out
          tar -czf out/thumbdeck-darwin-universal.tar.gz -C src-tauri/target/universal-apple-darwin/release/bundle/macos thumbdeck.app

      - name: Sign for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri signer sign --app-version "$VERSION" out/thumbdeck-${{ matrix.platform }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: out/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commits since the last release are its notes

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Release notes and latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --format='- %s' ${previous:+$previous..}"$GITHUB_REF_NAME" > notes.md
          python3 scripts/latest_json.py "$version" notes.md out > out/latest.json
          cat out/latest.json

      - name: Publish to Nozeren/thumbdeck-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          files=(out/*.tar.gz out/*.sig out/latest.json install.sh)
          repo=Nozeren/thumbdeck-releases
          if gh release view "$GITHUB_REF_NAME" -R "$repo" > /dev/null 2>&1; then
            # A rebuild of a release (its tag moved to a newer commit): replace its files and notes
            gh release upload "$GITHUB_REF_NAME" -R "$repo" --clobber "${files[@]}"
            gh release edit "$GITHUB_REF_NAME" -R "$repo" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" -R "$repo" \
              --title "thumbdeck ${GITHUB_REF_NAME#v}" --notes-file notes.md "${files[@]}"
          fi
